name: verify

# Minden pull requesten es a fo agon fut. A cel nem a teljesseg, hanem az, hogy
# egy hiba NE a stage kornyezetben derüljön ki eloszor. A lepesek sorrendje
# szandekos: a gyorsak elol, hogy egy elgepeles ne varjon a buildre.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A KIRAKAT PUBLIKALHATO KULCSA, EGY HELYEN, MERT KET LEPESNEK KELL.
    #
    # HOL KELL, ES MIERT:
    #   Lint   -- a `next lint` betolti a `next.config.js` fajlt, az pedig
    #             meghivja a `check-env-variables` fuggvenyt, es az KILEP, ha
    #             ez a valtozo hianyzik.
    #   Build  -- ugyanez, ES azon felul a kirakat `generateStaticParams`
    #             fuggvenye HAROM oldalon (kategoria, termek, gyujtemeny) MAR
    #             EPITES KOZBEN lekerdezi a Store API-t.
    #
    # MERVE, ES A SAJAT MERESEM HIBAJABOL (2026-09-07): helyben a `turbo build`
    # zold volt, mert EN mindig atadtam a kulcsot a parancsnak. A CI nem adta,
    # es a Build lepes elhasalt: "Missing required environment variables". A
    # zold tehat a KORNYEZETEM tulajdonsaga volt, nem a kode -- es eloszor csak
    # a Lint lepesre tettem be, mert ott futottam bele eloszor.
    #
    # MIERT SZABAD EZ A KULCS ITT, ES MIERT NEM AKARMELYIK:
    #   - PUBLIKALHATO kulcs: a kirakat build-je amugy is a bongeszo forrasaba
    #     teszi, tehat aki megnyitja a boltot, latja
    #   - a repo PRIVAT
    # ADMIN VAGY TITKOS KULCS SOHA NEM KERULHET IDE. Ott a masolat maga lenne a
    # szivargas -- egy nyilvanos repoban egy elgepelt kulcs veglegesen kikerul,
    # es a torles nem segit.
    #
    # A GitHub Actions valtozo-felulete helyett azert all itt, mert a tokenunk
    # azt megtagadta (403, "Resource not accessible by personal access token")
    # -- nem jogosultsag-hiany a repon, hanem a token hatokore.
    # ES A KULCS EGYEDUL KEVES: A BUILD TENYLEGESEN LEKERDEZI A BOLTOT.
    #
    # A kulcs potlasa utan a Build masodszor is elhasalt, MAS hibaval:
    # `TypeError: fetch failed ... ECONNREFUSED`, a kategoria-oldal
    # `generateStaticParams` lepesenel. Az ok: cim hijan a kirakat az
    # `.env.template` alapertelmezesere esik (`http://localhost:9000`), es a
    # futtatoban ott nem all semmi.
    #
    # Vagyis a hibat ket lepesben talaltam meg, es MIND A KETTOT a CI mondta
    # meg -- helyben egyik sem allt elo, mert en a teljes kornyezetet atadtam a
    # parancsnak. A Dockerfile fejlece MIND A NEGY valtozot felsorolja; ide
    # eloszor csak azt tettem be, amelyikbe eloszor beleutkoztem.
    #
    # A BUILD FUGG A STAGING BOLT ELERHETOSEGETOL, ES EZ A KERDES AZOTA EL IS
    # DOLT. Ez a bekezdes korabban nyitott valasztaskent allt itt ("a masik ut
    # az lenne, hogy a generateStaticParams ures listat ad, de az egy valodi
    # hibat is elnyelne -- felirva; a valasztas nem a kirakate"). ATIRVA, mert
    # egy megjegyzes, ami egy MAR MEGHOZOTT dontest nyitottkent ir le, rosszabb
    # a semminel: a kovetkezo olvaso egy lezart kerdest keresne.
    #
    # 2026-09-07 15:43-kor pontosan az allt elo, amit ez a bekezdes elore
    # jelzett: a stage nehany percre elment (a lemez takaritasa miatt), es a
    # Build elhasalt `Error: Service Unavailable` uzenettel, a gyujtemeny-lap
    # `generateStaticParams` lepesenel. A kod erintetlen volt.
    #
    # A #53 UTAN mind a harom epites-ideju utvonal elkapta ezt es URES LISTAT
    # adott -- DE EZ MA MAR NEM IGAZ, es a bekezdes eddig a regi viselkedest
    # irta le. A #64 ("keep the build-time failure loud, but say what to
    # check") lecserelte: az `epitesiHibaMegnevezve` KIIRJA a diagnozist es
    # UJRADOBJA a hibat (a visszateresi tipusa `never`). Ures lista tehat
    # nincs, es a build ELHASAL.
    #
    # AMI HELYETTE VAN, ES MIERT JOBB: a kimenet kimondja, hogy a bolt nem
    # valaszol, megnevezi a cimet, es megmondja a teendot -- "INDITSD UJRA a
    # futast. A kodhoz nem kell hozzanyulni." A felismerest a
    # `boltHibanakLatszik` vegzi, es a specje a NEMLEGES iranyt is meri: egy
    # valodi kod-hibat NEM nevez bolt-kiesesnek, kulonben a fejleszto a boltot
    # nezne egy elgepelt mezo helyett.
    #
    # MIERT VAN ATIRVA EZ A BEKEZDES, ES NEM KIEGESZITVE: azt allitotta, hogy a
    # bolt kiesese NEM viszi pirosra a buildet. Egy megjegyzes, ami egy MEG NEM
    # LETEZO (vagy azota megszunt) vedelmet ir le, rosszabb a semminel -- a
    # kovetkezo olvaso kizarna a bolt-kiesest, amikor pont az all fenn.
    #
    # ES EZ NEM ELMELETI: 2026-09-09 15:59:44 UTC-kor a Build pontosan igy
    # bukott el (`Error: Service Unavailable`, "Failed to collect page data for
    # /[countryCode]/products/[handle]"), nulla bukott teszt mellett. Ugyanazon
    # az agon a KOVETKEZO KET futas zold lett (16:42 es 16:51), kod-valtozas
    # nelkul a bukott resze -- vagyis a diagnozis helyes volt, es a teendo is:
    # ujra kellett futtatni.
    env:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://commerce-stage.acropora.hu
      NEXT_PUBLIC_DEFAULT_REGION: hu
      NEXT_PUBLIC_BASE_URL: https://shop-staging.acropora.hu
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ba7f178c2b6b94dc96334fc7f24d32c3949b4575fc764658812fcd508a8b7dcc

    steps:
      - uses: actions/checkout@v4

      # A pnpm A NODE ELE KELL: a `setup-node` gyorsitotara a csomagkezelo
      # lockfile-jat keresi, es ha a pnpm meg nincs telepitve, a `cache: pnpm`
      # lepes elhasal.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          # A repo package.json-ja: ^20.19.0 || >=22.12.0
          node-version: '22'
          cache: pnpm

      - name: Telepites
        # `--frozen-lockfile`: a lockfile-bol telepit, es MEGALL, ha az nem illik
        # a package.json fajlokhoz. Igy egy elfelejtett lockfile-frissites itt
        # bukik el, nem az eles buildben.
        run: pnpm install --frozen-lockfile

      - name: Titok-kereses a valtozasokban
        # Publikus repo eseten egy elgepelt kulcs veglegesen kikerul, es a
        # torles nem segit. Ez a lepes a MOSTANI fat nezi at, nem a tortenetet.
        #
        # AZ ELOZO VALTOZAT KIZARTA A `*.example` ES `*.template` FAJLOKAT --
        # PONTOSAN AZT A FAJLTIPUST, AHOL A 2026-08-25-I SZIVARGAS TORTENT.
        # A kizarasnak volt oka: a sablonok helykitolto ertekeket hordoznak, es
        # egy puszta mintalista azokon folyton riadot fujt volna. De a valasz
        # arra nem a fajlok atugrasa, hanem hogy a keres az ANYAGOT nezze, ne
        # csak a jelolot. Egy orzo, ami vak arra a helyre, ahol az incidens
        # tortent, diszlet.
        #
        # A kereses ezert atkerult egy szkriptbe, ami entropiat es alakot mer,
        # es amit a pre-commit hook is ugyanigy hiv. A reszletek es a VAK FOLT
        # a szkript fejlecében allnak.
        run: node scripts/scan-secrets.mjs

      # A FORMAZAS ELLENORZESE -- ES A HELYE SZANDEKOS: A LINT ELOTT.
      #
      # MIERT LETEZIK: 2026-09-07-ig ket prettier verzio elt egy repoban (a
      # gyoker 3-as, az `apps/storefront` 2.8.8), es a verify a formazast NEM
      # nezte. Ugyanazt a fajlt ket ember oda-vissza formazhatta, es semmi nem
      # szolt. Nem elmeleti: a #103 es a #104 UGYANAZT A KET SORT mozgatta
      # ellentetes iranyba, harom perc kulonbseggel, es mind a ketto zold volt.
      #
      # A VERZIO-EGYSEGESITES ONMAGABAN NEM ELEG: az egy PILLANATOT rendez el.
      # Ez a lepes az, ami megtartja -- onnantol a kerdes nem izles, hanem
      # piros vagy zold.
      #
      # ES EGY HARMADIK ALLAPOTOT IS MEGSZUNTET, ami a verzio-lepesnel derult
      # ki: a repo egy resze SOHA nem ment at formazon (pontosvesszos fajlok
      # alltak benne, holott a helyi `.prettierrc.json` `semi: false`-ot ir
      # elo). Nem ket allapot volt, hanem harom.
      #
      # MIERT A LINT ELOTT: masodpercekben fut, es a repo sajat sorrend-elve
      # szerint "a gyorsak elol, hogy egy elgepeles ne varjon a buildre".
      #
      # A HATOKORE KIMONDVA: a kirakat forrasat nezi (`apps/storefront/src`),
      # nem a teljes repot. A tobbi csomag formazasa kulon kerdes, es nem ez a
      # lepes donti el -- egy szelesebb minta itt olyan fajlokat hozna be,
      # amikre nem futott meg a formazo.
      #
      # ES A BEVEZETES FELTETELE MERVE VOLT, NEM FELTETELEZVE: a friss fo agon
      # (`a2fda8d`) ugyanez a parancs NULLA elteresre fut. Egy kapu, ami a
      # bevezetese napjan pirosat ad, nem kaput mutat, hanem zajt.
      - name: Formazas
        run: pnpm exec prettier --check "apps/storefront/src/**/*.{ts,tsx,css}"

      - name: Lint
        run: pnpm run lint

      - name: Tipusellenorzes
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit -p tsconfig.json

      # A KIRAKAT TIPUSELLENORZESE KULON LEPES, ES EDDIG EGYALTALAN NEM LETEZETT.
      #
      # MERVE (2026-09-07, murena es acrobot): a fenti lepes
      # `working-directory: apps/backend` alatt fut, a kirakat next.config.js-e
      # pedig `typescript.ignoreBuildErrors: true` -- vagyis a Build kiirja, hogy
      # "Skipping validation of types", es a kirakatot SEMMI nem tipusellenorzi.
      # Ket TS2559 igy allt a fo agon ugy, hogy minden ellenorzes zold volt.
      #
      # ES AMIERT A JAVITASSAL EGYUTT MEGY, NEM KESOBB (acrobot dontese): egy
      # javitas, ami melle nem all kapu, EGYSZER igaz. Ma harom hianyzo kaput
      # talaltunk a kirakaton egyetlen nap alatt, es mind a harom ugy maradt
      # fenn, hogy a szam kozben zold volt.
      #
      # A `--filter` szandekos, ugyanabbol az okbol, mint a tesztlepesnel: a
      # backendet a fenti lepes viszi.
      - name: Kirakat tipusellenorzes
        run: pnpm --filter @dtc/storefront exec tsc --noEmit -p tsconfig.json

      - name: Unit tesztek
        working-directory: apps/backend
        run: pnpm run test:unit

      # A KIRAKAT TESZTJEI KULON LEPES, MERT A FENTI CSAK A BACKENDET FUTTATJA.
      #
      # MERVE (2026-09-07): a kirakatban addig EGYALTALAN NEM VOLT tesztfutto.
      # Amikor bekerult (vitest), a CI-ben semmi nem hivta -- a `pnpm run
      # test:unit` lepes `working-directory: apps/backend` alatt fut, a `turbo
      # test` pedig sehol nem szerepelt. Egy meres, amit senki nem futtat,
      # ugyanaz, mint egy orzo, ami szol de nem allit meg: ott van, es nem ved.
      #
      # A `--filter` szandekos: a backend tesztjeit a fenti lepes viszi, es ket
      # helyen futtatni ugyanazt csak a kaput lassitja.
      - name: Kirakat tesztek
        run: pnpm --filter @dtc/storefront test

      - name: Build
        run: pnpm run build
