name: verify

# Minden pull requesten es a fo agon fut. A cel nem a teljesseg, hanem az, hogy
# egy hiba NE a stage kornyezetben derüljön ki eloszor. A lepesek sorrendje
# szandekos: a gyorsak elol, hogy egy elgepeles ne varjon a buildre.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # A repo package.json-ja: ^20.19.0 || >=22.12.0
          node-version: '22'
          cache: npm

      - name: Telepites
        run: npm ci

      - name: Titok-kereses a valtozasokban
        # Publikus repo eseten egy elgepelt kulcs veglegesen kikerul, es a
        # torles nem segit. Ez a lepes a MOSTANI fat nezi at, nem a tortenetet.
        #
        # AZ ELOZO VALTOZAT KIZARTA A `*.example` ES `*.template` FAJLOKAT --
        # PONTOSAN AZT A FAJLTIPUST, AHOL A 2026-08-25-I SZIVARGAS TORTENT.
        # A kizarasnak volt oka: a sablonok helykitolto ertekeket hordoznak, es
        # egy puszta mintalista azokon folyton riadot fujt volna. De a valasz
        # arra nem a fajlok atugrasa, hanem hogy a keres az ANYAGOT nezze, ne
        # csak a jelolot. Egy orzo, ami vak arra a helyre, ahol az incidens
        # tortent, diszlet.
        #
        # A kereses ezert atkerult egy szkriptbe, ami entropiat es alakot mer,
        # es amit a pre-commit hook is ugyanigy hiv. A reszletek es a VAK FOLT
        # a szkript fejlecében allnak.
        run: node scripts/scan-secrets.mjs

      - name: Lint
        # A KIRAKAT LINTJE BETOLTI A `next.config.js` FAJLT, AZ PEDIG MEGHIVJA A
        # `check-env-variables` FUGGVENYT -- ES AZ KILEP, HA EZ A VALTOZO HIANYZIK.
        # Merve 2026-09-07: kulcs nelkul a lint a hianyzo valtozo uzenetevel all
        # meg, kulccsal lefut. Vagyis ez nem a lint tartalmarol szol, hanem arrol,
        # hogy a config egyaltalan betoltodjon.
        #
        # MIERT SZABAD EZ A KULCS ITT, ES MIERT NEM AKARMELYIK:
        #   - PUBLIKALHATO kulcs, tehat a kirakat build-je amugy is a bongeszo
        #     forrasaba teszi: aki megnyitja a boltot, latja
        #   - a repo PRIVAT
        # ADMIN VAGY TITKOS KULCS SOHA NEM KERULHET IDE. Ott a masolat maga
        # lenne a szivargas -- egy nyilvanos repoban egy elgepelt kulcs
        # veglegesen kikerul, es a torles nem segit.
        #
        # A GitHub Actions valtozo-felulet helyett azert all itt, mert a
        # tokenunk azt megtagadta (403, "Resource not accessible by personal
        # access token") -- nem jogosultsag-hiany a repon, hanem a token
        # hatokore.
        env:
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: pk_ba7f178c2b6b94dc96334fc7f24d32c3949b4575fc764658812fcd508a8b7dcc
        run: npm run lint

      - name: Tipusellenorzes
        working-directory: apps/backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tesztek
        working-directory: apps/backend
        run: npm run test:unit

      - name: Build
        run: npm run build
